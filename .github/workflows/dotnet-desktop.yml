name: .NET Build & Package

on:
  push:
    branches: [net462]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-vsto:
    name: Build VSTO
    runs-on: windows-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Cache VSTO build output
        id: cache-vsto
        uses: actions/cache@v5
        with:
          path: |
            InkCanvas.PowerPointAddIn/bin/Release
            InkCanvas.PPTAgent.Contracts/bin/Release
          key: vsto-${{ hashFiles('InkCanvas.PowerPointAddIn/**') }}

      - parallel:

        - name: Setup dotnet
          if: steps.cache-vsto.outputs.cache-hit != 'true'
          uses: actions/setup-dotnet@v5

        - name: Setup MSBuild
          if: steps.cache-vsto.outputs.cache-hit != 'true'
          uses: microsoft/setup-msbuild@v3

        - name: Install VSTO Runtime
          if: steps.cache-vsto.outputs.cache-hit != 'true'
          shell: pwsh
          run: |
            $url = "https://go.microsoft.com/fwlink/?LinkId=158918"
            $out = "$env:TEMP\VSTORuntime.exe"
            Invoke-WebRequest -Uri $url -OutFile $out -MaximumRedirection 10
            Start-Process -FilePath $out -ArgumentList "/quiet /norestart" -Wait -NoNewWindow
            Write-Host "VSTO Runtime installed"

      - parallel:

        - name: Restore Package 
          if: steps.cache-vsto.outputs.cache-hit != 'true'
          run: dotnet restore "Ink Canvas.sln"

        - name: Restore signing certificate
          if: steps.cache-vsto.outputs.cache-hit != 'true'
          shell: pwsh
          run: |
            $ok = $false
            if ("${{ secrets.CERT_PFX_BASE64 }}" -ne "") {
              try {
                $bytes = [Convert]::FromBase64String("${{ secrets.CERT_PFX_BASE64 }}")
                [IO.File]::WriteAllBytes("clickonce.pfx", $bytes)
                $pwd = ConvertTo-SecureString "${{ secrets.CERT_PFX_PASSWORD }}" -AsPlainText -Force
                Import-PfxCertificate -FilePath "clickonce.pfx" -CertStoreLocation Cert:\CurrentUser\My -Password $pwd | Out-Null
                $ok = $true
                Write-Host "Certificate imported from secrets"
              } catch {
                Write-Host "Import PFX failed, falling back to self-signed: $($_.Exception.Message)"
              }
            }
            if (-not $ok) {
              New-SelfSignedCertificate `
                -Type CodeSigningCert `
                -Subject "CN=ICC PowerPoint Agent CI" `
                -CertStoreLocation "Cert:\CurrentUser\My" `
                -KeyExportPolicy Exportable `
                -NotAfter (Get-Date).AddYears(2) | Out-Null
              Write-Host "Generated self-signed certificate"
            }
            $found = Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.HasPrivateKey -and $_.Subject -like "*ICC*" } | Select-Object -First 1
            if (-not $found) { throw "No signing certificate found" }
            echo "SIGN_THUMBPRINT=$($found.Thumbprint)" >> $env:GITHUB_ENV
            Write-Host "Signing certificate ready: $($found.Thumbprint)"

      - name: Build VSTO Add-in
        if: steps.cache-vsto.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          msbuild "InkCanvas.PowerPointAddIn/InkCanvas.PowerPointAddIn.csproj" `
            /p:Configuration=Release `
            /p:SignManifests=true `
            /p:ManifestCertificateThumbprint=$env:SIGN_THUMBPRINT `
            /verbosity:minimal -maxcpucount
          
          if (Test-Path "InkCanvas.PowerPointAddIn\bin\Release\InkCanvas.PowerPointAddIn.dll") {
            Write-Host "VSTO DLL OK"
          } else {
            Write-Error "VSTO DLL not found"
            exit 1
          }

  build-and-package:
    name: Build & Package
    runs-on: windows-latest
    needs: [build-vsto]
    strategy:
      fail-fast: false
      matrix:
        architecture: [AnyCPU, x86, arm64]
        minimize: [true, false]
    steps:
      - parallel:
        - name: Checkout code
          uses: actions/checkout@v6
          with:
            fetch-depth: 1
        
        - name: Setup dotnet
          uses: actions/setup-dotnet@v5

      - parallel:
        - name: Restore Package 
          run: dotnet restore "Ink Canvas.sln"

        - name: Cache VSTO build output
          id: cache-vsto-restore
          if: matrix.minimize != 'true'
          uses: actions/cache@v5
          with:
            path: |
              InkCanvas.PowerPointAddIn/bin/Release
              InkCanvas.PPTAgent.Contracts/bin/Release
            key: vsto-${{ hashFiles('InkCanvas.PowerPointAddIn/**')}}

      - name: Build the Solution
        env:
          DLASS_TELEMETRY_TOKEN: ${{ secrets.DLASS_TELEMETRY_TOKEN }}
        run: |
          $platform = "${{ matrix.architecture }}"
          if ($platform -eq "AnyCPU") { $platform = "Any CPU" }
          dotnet build -c Release -p:platform="$platform" -p:GitFlow="$GITFLOW" -p:Minimize="${{ matrix.minimize }}" --no-restore -m

      - name: Build & Upload
        id: build-result
        shell: pwsh
        run: |
          $arch = "${{ matrix.architecture }}".Replace(" ", "")
          $exePath = "Ink Canvas\bin\Release\$arch\net462\InkCanvasForClass.exe"
          
          if (Test-Path $exePath) {
            echo "build_success=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "build_success=false" >> $env:GITHUB_OUTPUT

            if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              exit 1
            }
          }

      - parallel:
        - name: Upload Artifact
          if: steps.build-result.outputs.build_success == 'true'
          uses: actions/upload-artifact@v7
          with:
            name: InkCanvasForClass.CE.${{ matrix.architecture }}${{ case(matrix.minimize == true, '.minimize', '') }}
            path: "Ink Canvas/bin/Release/${{ matrix.architecture }}/net462/*"
            compression-level: 9

        - name: Create Summary
          if: always()
          env:
            MINIMIZE: ${{ matrix.minimize }}
          shell: bash
          run: |
            SHORT_SHA=${GITHUB_SHA::7}
            VERSION="debug-${SHORT_SHA}-${GITHUB_RUN_NUMBER}"
            ARCH="${{ matrix.architecture }}"
            [ "$MINIMIZE" = "true" ] && SUFFIX=".minimize" || SUFFIX=""
            ARTIFACT="InkCanvasForClass.CE.${ARCH}${SUFFIX}"

            echo "# Build Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ "${{ steps.build-result.outputs.build_success }}" = "true" ]; then
              echo "## ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
              echo "**Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
              echo "**Version:** ${{ steps.create-archive.outputs.archive_name }}" >> $GITHUB_STEP_SUMMARY
              echo "**Architecture:** ${{ matrix.architecture }}" >> $GITHUB_STEP_SUMMARY
              echo "**Minimize:** $MINIMIZE" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "[Download Artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              if [ "$MINIMIZE" = "true" ]; then
                suffix=".minimize"
              else
                suffix=""
              fi
              echo "[Nightly.link Download](https://nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/InkCanvasForClass.CE.${{ matrix.architecture }}$suffix.zip) \([GhProxy Fastly Mirror](https://cdn.gh-proxy.com/nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/InkCanvasForClass.CE.${{ matrix.architecture }}$suffix.zip) / [GhProxy Mirror](https://gh-proxy.com/nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/InkCanvasForClass.CE.${{ matrix.architecture }}$suffix.zip)\)" >> $GITHUB_STEP_SUMMARY
            else
              echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Event:** ${{ github.event_name }} (${{ github.event.action || 'N/A' }})" >> $GITHUB_STEP_SUMMARY
              echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
              echo "**Architecture:** ${{ matrix.architecture }}" >> $GITHUB_STEP_SUMMARY
              echo "**Minimize:** $MINIMIZE" >> $GITHUB_STEP_SUMMARY
              echo "**Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Check build logs for details." >> $GITHUB_STEP_SUMMARY
            fi
