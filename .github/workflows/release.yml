name: Draft Release

on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/dotnet-desktop.yml
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts

      - name: Package release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Get-ChildItem artifacts -Directory | ForEach-Object {
            $archive = Join-Path $PWD "release/$($_.Name).zip"
            [System.IO.Compression.ZipFile]::CreateFromDirectory($_.FullName, $archive)
          }
          if (-not (Get-ChildItem release -Filter *.zip)) { throw "No release assets found" }

      # Enable release immutability in repository settings for GitHub's attestation on publication.
      - name: Create draft release
        uses: softprops/action-gh-release@v3.0.4
        with:
          draft: true
          files: release/*.zip
          fail_on_unmatched_files: true
